name: Release

# タグ駆動リリース (仕様 §8.4)。`v1.2.3` のようなタグを push すると、
# build.yml で単一 exe を発行し、GitHub Release へ添付する。
# 発行・検証の手順は build.yml と共有する (手動ビルドと食い違わせないため)。
on:
  push:
    tags: ['v*']

permissions:
  contents: write # Release の作成と成果物添付に必要

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - name: Derive version from tag
        id: derive
        run: |
          # v1.2.3 → 1.2.3 / v1.2.3-rc.1 → 1.2.3-rc.1
          version="${GITHUB_REF_NAME#v}"
          # 対応しないタグ形式は事前に拒否する。ビルドメタデータ (+build.1) を含むタグは
          # MSBuild の Version としての扱いが環境依存で、埋め込まれる値とタグが食い違った
          # まま公開され得るため受け付けない。
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "対応していないタグ形式です: $GITHUB_REF_NAME" >&2
            echo "対応形式: vMAJOR.MINOR.PATCH[-プレリリース識別子] (例: v1.2.3, v1.2.3-rc.1)" >&2
            echo "ビルドメタデータ (+build.1) を含むタグには対応していません。" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # プレリリース識別子 (1.2.3-rc.1) を含む場合は Release も prerelease にする。
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: publish

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## インストール

          `FloorLeveler.exe` をダウンロードして実行してください。インストーラーも
          追加の DLL 配置も不要です (`openvr_api.dll` は SteamVR に付属するものを
          読み込みます)。

          `FloorLeveler.exe` と同じディレクトリに `openvr_api.dll` を置いた場合は、
          そちらが優先されます (任意のバージョンを使いたい場合)。

          動作環境: Windows 10 22H2 以降 / Windows 11 (x64)、SteamVR 起動中。
          EOF

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # このジョブは checkout しない (必要なのは成果物だけ) ため、gh が
          # 対象リポジトリを推測できる Git リモートが無い。明示的に指定する。
          GH_REPO: ${{ github.repository }}
        run: |
          flags=(--title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag)
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" publish/FloorLeveler.exe "${flags[@]}"
