name: Release

# タグ駆動リリース (仕様 §8.4)。`1.2.3` / `v1.2.3` のようなタグを push すると、
# build.yml で単一 exe を発行し、GitHub Release へ添付する。
# 発行・検証の手順は build.yml と共有する (手動ビルドと食い違わせないため)。
#
# 接頭辞 `v` の有無はどちらも受け付ける。このリポジトリの既存タグ (0.0.1 / 0.1.0) は
# `v` なしで、`v*` だけを見ていると起動しないため。
# 条件は「数字始まり」または「v + 数字始まり」とだけ書く。ここで細かく絞り込むより、
# バージョン形式の検証は下の version ジョブ 1 箇所に任せる方が、
# 起動しない (=何も起きず気づけない) 失敗より、起動して明示的に落ちる方がよい。
on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'

permissions:
  contents: write # Release の作成と成果物添付に必要

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      prerelease: ${{ steps.derive.outputs.prerelease }}
    steps:
      - name: Derive version from tag
        id: derive
        run: |
          # 1.2.3 → 1.2.3 / v1.2.3-rc.1 → 1.2.3-rc.1 (接頭辞 v は任意)
          version="${GITHUB_REF_NAME#v}"
          # 対応しないタグ形式は事前に拒否する。ビルドメタデータ (+build.1) を含むタグは
          # MSBuild の Version としての扱いが環境依存で、埋め込まれる値とタグが食い違った
          # まま公開され得るため受け付けない。
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "対応していないタグ形式です: $GITHUB_REF_NAME" >&2
            echo "対応形式: [v]MAJOR.MINOR.PATCH[-プレリリース識別子] (例: 1.2.3, v1.2.3-rc.1)" >&2
            echo "ビルドメタデータ (+build.1) を含むタグには対応していません。" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # プレリリース識別子 (1.2.3-rc.1) を含む場合は Release も prerelease にする。
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.version.outputs.version }}

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: publish

      - name: Write release notes
        env:
          EXE: ${{ needs.build.outputs.exe }}
        run: |
          # 本文は展開なしのヒアドキュメントで書き、exe 名だけ後から差し込む。
          # 本文にはコードスパンのバックティックが含まれるため、展開ありにすると
          # コマンド置換として解釈されてしまう。
          cat > release-notes.md <<'EOF'
          ## インストール

          `@EXE@` をダウンロードして実行してください。インストーラーも
          追加の DLL 配置も不要です (`openvr_api.dll` は SteamVR に付属するものを
          読み込みます)。

          ダウンロードした exe と同じディレクトリに `openvr_api.dll` を置いた場合は、
          そちらが優先されます (任意のバージョンを使いたい場合)。

          動作環境: Windows 10 22H2 以降 / Windows 11 (x64)、SteamVR 起動中。
          EOF
          sed -i "s|@EXE@|$EXE|g" release-notes.md

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # このジョブは checkout しない (必要なのは成果物だけ) ため、gh が
          # 対象リポジトリを推測できる Git リモートが無い。明示的に指定する。
          GH_REPO: ${{ github.repository }}
          EXE: ${{ needs.build.outputs.exe }}
        run: |
          # GitHub の UI からリリースを作ると、タグとリリースが同時にできる。
          # その場合このワークフローが走り終える頃には既にリリースが存在するため、
          # create は「既にある」で失敗する。既存なら成果物の添付だけを行い、
          # ユーザーが書いたリリースノートは上書きしない。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "リリースが既に存在するため、成果物のみ添付します: $GITHUB_REF_NAME"
            gh release upload "$GITHUB_REF_NAME" "publish/$EXE" --clobber
            exit 0
          fi

          flags=(--title "$GITHUB_REF_NAME" --notes-file release-notes.md --verify-tag)
          if [ "${{ needs.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "publish/$EXE" "${flags[@]}"
