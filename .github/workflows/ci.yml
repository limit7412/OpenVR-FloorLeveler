name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  # 単一 exe 発行が壊れていないこと (仕様 §8.2) とサイズ予算 (NF-2) を、
  # 全 push / PR で安く確認する。exe を起動する検証はここでは行わない
  # (Windows ランナーが必要なため、リリース用の build.yml に置いている)。
  publish:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish single-file exe (win-x64)
        run: >
          dotnet publish src/FloorLeveler.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish
      - name: Check size budget (NF-2, 60MB 以下)
        run: |
          size=$(stat -c%s publish/FloorLeveler.exe)
          echo "FloorLeveler.exe: $((size / 1024 / 1024)) MB"
          test "$size" -le $((60 * 1024 * 1024))
      - uses: actions/upload-artifact@v4
        with:
          name: FloorLeveler-win-x64
          path: publish/FloorLeveler.exe
