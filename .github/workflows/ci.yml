name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --configuration Release --no-restore
      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  publish:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Fetch openvr_api.dll (exe 内包用, 仕様 §8.2)
        run: bash scripts/fetch-openvr-dll.sh
      - name: Publish single-file exe (win-x64)
        run: >
          dotnet publish src/FloorLeveler.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish
      - name: Check size budget (NF-2, 60MB 以下)
        run: |
          size=$(stat -c%s publish/FloorLeveler.exe)
          echo "FloorLeveler.exe: $((size / 1024 / 1024)) MB"
          test "$size" -le $((60 * 1024 * 1024))
      # 成果物にもライセンス通知を同梱する。exe には openvr_api.dll (BSD 3-Clause) が
      # 内包されており、この ZIP を単体でダウンロード・共有しても通知が伴うようにするため。
      - name: Bundle license notice
        run: cp THIRD-PARTY-NOTICES.md publish/
      - uses: actions/upload-artifact@v4
        with:
          # 2 つとも publish/ 配下にしておくと ZIP 直下に平置きされる
          # (共通の親ディレクトリが ZIP のルートになるため)。
          name: FloorLeveler-win-x64
          path: |
            publish/FloorLeveler.exe
            publish/THIRD-PARTY-NOTICES.md
